openapi: 3.1.0
info:
  title: XML S3 Sync Manager API
  summary: REST API for auth and S3 object storage
  description: |
    Browser clients call this API for auth and object storage.
    Durable XML lives in S3. Editor drafts and change logs live in the browser.
    There is no server-side scratch document store.

    AWS credentials stay on the server. The client sends logical object keys and XML.

    Logout revokes the current access token on this API process until the token expires.
    Extra uvicorn workers do not share that denylist.
  version: 1.0.0
  license:
    name: UNLICENSED

servers:
  - url: /api/v1
    description: Same-origin (Vite proxy or reverse proxy)
  - url: http://localhost:8080/api/v1
    description: Local backend

tags:
  - name: Health
  - name: Auth
  - name: Objects

security:
  - bearerAuth: []

paths:
  /health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Liveness and readiness
      security: []
      responses:
        '200':
          description: Service is up
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /auth/config:
    get:
      tags: [Auth]
      operationId: getAuthConfig
      summary: Public Entra / profile flags for the SPA
      security: []
      responses:
        '200':
          description: Browser auth configuration (never includes the TEST bearer token)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntraPublicConfig'

  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Create a session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/entra/token:
    post:
      tags: [Auth]
      operationId: exchangeEntraCode
      summary: Exchange an authorization code using the server redirect URI
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntraCodeExchangeRequest'
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Sign out and revoke this access token on this process until it expires
      responses:
        '204':
          description: Signed out
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      summary: Current authenticated user
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /objects:
    get:
      tags: [Objects]
      operationId: listObjects
      summary: List stored XML objects (backend maps to S3)
      parameters:
        - name: prefix
          in: query
          schema:
            type: string
          description: Logical key prefix under IN/ or OUT/
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Object listing (metadata only)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoredObjectList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      tags: [Objects]
      operationId: putObject
      summary: Push XML to storage
      description: |
        Backend writes to S3 using server-side credentials. The request must not
        include AWS keys, KMS key IDs, bucket names, or encryption settings.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutObjectRequest'
      responses:
        '200':
          description: Stored or overwritten
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /objects/content:
    get:
      tags: [Objects]
      operationId: getObject
      summary: Pull XML content by logical key
      parameters:
        - name: key
          in: query
          required: true
          schema:
            type: string
            minLength: 1
          description: Logical object key under IN/ or OUT/
      responses:
        '200':
          description: Object with XML body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoredObject'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Limit:
      name: limit
      in: query
      description: >
        Maximum number of items to return. Object listings are sorted by last
        modified descending, so this is the N most recently updated XML files.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Authenticated but not allowed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Version conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          examples: [validation_error, unauthorized, forbidden, not_found]
        message:
          type: string

    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string

    UserRole:
      type: string
      enum: [Administrator, Content Editor, Viewer]

    User:
      type: object
      required: [id, name, email, role]
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/UserRole'

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 1

    SessionResponse:
      type: object
      required: [token, tokenType, user]
      properties:
        token:
          type: string
          description: JWT or opaque session token
        tokenType:
          type: string
          enum: [Bearer]
        expiresInSeconds:
          type: integer
          minimum: 1
        user:
          $ref: '#/components/schemas/User'

    EntraPublicConfig:
      type: object
      required: [enabled, tenantId, clientId, authority, redirectUri, postLogoutRedirectUri, scopes, apiAudience]
      properties:
        enabled:
          type: boolean
        tenantId:
          type: string
        clientId:
          type: string
        authority:
          type: string
        redirectUri:
          type: string
        postLogoutRedirectUri:
          type: string
        scopes:
          type: array
          items:
            type: string
        apiAudience:
          type: string
        profile:
          type: string
        testAuthEnabled:
          type: boolean
        testEmail:
          type: string
          nullable: true
        testName:
          type: string
          nullable: true

    EntraCodeExchangeRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
        redirectUri:
          type: string
          description: Ignored; the server uses ENTRA_REDIRECT_URI
        codeVerifier:
          type: string

    PutObjectRequest:
      type: object
      required: [objectKey, xmlContent, fileName]
      additionalProperties: false
      properties:
        objectKey:
          type: string
          minLength: 1
          description: >
            Logical destination path under IN/. Must not start with / or contain
            `..`. Example: IN/2026/09/07/file.xml. Paths outside IN/ are rejected.
        fileName:
          type: string
          maxLength: 255
        xmlContent:
          type: string
          minLength: 1
          maxLength: 5242880
        ifMatch:
          type: string
          description: Optional S3 ETag; mismatch returns 409

    StoredObject:
      type: object
      required: [objectKey, fileName, sizeBytes, lastModified, xmlContent]
      properties:
        objectKey:
          type: string
        fileName:
          type: string
        sizeBytes:
          type: integer
          minimum: 0
        lastModified:
          type: string
          format: date-time
        etag:
          type: string
        versionId:
          type: string
        storageUri:
          type: string
          description: Opaque URI returned by the backend (for example an s3:// URI)
        xmlContent:
          type: string

    StoredObjectSummary:
      type: object
      required: [objectKey, fileName, sizeBytes, lastModified]
      properties:
        objectKey:
          type: string
        fileName:
          type: string
        sizeBytes:
          type: integer
        lastModified:
          type: string
          format: date-time
        etag:
          type: string
        versionId:
          type: string
        storageUri:
          type: string

    StoredObjectList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/StoredObjectSummary'

    SyncResult:
      type: object
      required: [syncId, timestamp, objectKey, sizeBytes]
      properties:
        syncId:
          type: string
        timestamp:
          type: string
          format: date-time
        objectKey:
          type: string
        etag:
          type: string
        versionId:
          type: string
        sizeBytes:
          type: integer
        storageUri:
          type: string
